# Deploys the online game server (a Cloudflare Worker) when it changes on main.
# Needs repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID. See README → "Cloudflare server".
name: Deploy game server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/engine/**'
      - 'src/data/**'
      - 'src/shared/**'
      - 'wrangler.jsonc'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
